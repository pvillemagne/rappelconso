services:
  - type: web
    name: rappelconso
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u server.py $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: APP_USER
        sync: false
      - key: APP_PASS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: RENDER
        value: "true"
